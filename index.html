<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="QuickNotes is a simple application for creating, viewing, and deleting notes."
    >

    <title>QuickNotes - Notes Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Your notes, organized in one place.</p>
        </div>
    </header>

    <main class="container">
        <section class="card" aria-labelledby="create-heading">
            <h2 id="create-heading">Create a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note Title</label>

                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                        placeholder="Enter your note title"
                    >

                    <small>Required. Maximum 100 characters.</small>
                </div>

                <div class="form-group">
                    <label for="body-input">Note Body</label>

                    <textarea
                        id="body-input"
                        name="body"
                        rows="4"
                        placeholder="Write your note here (optional)"
                    ></textarea>
                </div>

                <button type="submit" id="submit-btn">
                    Create Note
                </button>
            </form>
        </section>

        <section class="notes-section" aria-labelledby="notes-heading">
            <div class="notes-header">
                <h2 id="notes-heading">Your Notes</h2>

                <button type="button" id="load-btn">
                    Load Notes
                </button>
            </div>

            <p id="status" class="status" role="status" aria-live="polite">
                Click "Load Notes" to retrieve notes from the server.
            </p>

            <ul id="notes-list" aria-label="Notes list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>QuickNotes System Design Project</p>
        </div>
    </footer>
</body>
</html>
